services:
  postgres:
    image: postgres:17-alpine
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  api:
    build: .
    env_file: .env
    depends_on:
      - postgres
      - redis
    command:
      - /bin/sh
      - -c
      - alembic -c src/migrations/postgres/alembic.ini upgrade head && python -m src.api
    ports:
      - "8000:8000"

  worker:
    build: .
    env_file: .env
    depends_on:
      - postgres
      - redis
    command: celery -A src.worker.app:celery_app worker --loglevel=INFO

  beat:
    build: .
    env_file: .env
    depends_on:
      - redis
    command: celery -A src.worker.app:celery_app beat --loglevel=INFO

volumes:
  postgres-data:
