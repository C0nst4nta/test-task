services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sync
      POSTGRES_USER: sync
      POSTGRES_PASSWORD: sync
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sync -d sync"]
      interval: 2s
      timeout: 2s
      retries: 15
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SYNC_DATABASE_URL: postgresql+asyncpg://sync:sync@postgres:5432/sync
      SYNC_SYSTEM_A_BASE_URL: http://127.0.0.1:8000/mock/system-a
      SYNC_SYSTEM_B_BASE_URL: http://127.0.0.1:8000/mock/system-b
      SYNC_MOCK_SYSTEM_A_FAIL: ${SYNC_MOCK_SYSTEM_A_FAIL:-false}
      SYNC_MOCK_SYSTEM_B_FAIL_IDS: ${SYNC_MOCK_SYSTEM_B_FAIL_IDS:-}
    command:
      - /bin/sh
      - -c
      - python -m src.cli upgrade head && python -m src.api
    ports:
      - "8000:8000"

volumes:
  postgres-data:
