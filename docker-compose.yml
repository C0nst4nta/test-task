services:
  postgres:
    image: postgres:17-alpine
    env_file:
      - path: .env.example
      - path: .env
        required: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 15
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: .
    env_file:
      - path: .env.example
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - python -m src.cli upgrade head && python -m src.api
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src

volumes:
  postgres-data:
