[build-system]
requires = [
    "setuptools==82.0.1",
    "wheel==0.47.0",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[project]
name = "sync-service"
version = "0.1.0"
description = "Backend prototype for synchronizing data between external systems"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.14.1",
    "asyncpg==0.31.0",
    "backoff==2.2.1",
    "celery[redis]==5.6.2",
    "fastapi==0.121.2",
    "greenlet==3.2.4",
    "httpx==0.28.1",
    "orjson==3.11.4",
    "pydantic[email]==2.12.4",
    "pydantic-settings==2.12.0",
    "sqlalchemy==2.0.44",
    "uvicorn[standard]==0.38.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.0.1",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "ruff==0.15.0",
]

[project.scripts]
sync-api = "src.api.__main__:main"

[tool.ruff]
line-length = 95
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "B",
    "I",
    "N",
    "C4",
    "T10",
    "T20",
    "ERA",
    "COM",
    "Q",
]
ignore = ["B008", "B904", "B905", "N818"]

[tool.ruff.lint.isort]
force-single-line = true
lines-after-imports = 2
known-first-party = ["src", "tests"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "double"
docstring-quotes = "double"
avoid-escape = true

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --no-cov-on-fail"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.report]
show_missing = true
fail_under = 80
omit = [
    "src/api/__main__.py",
    "src/migrations/*",
]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == '__main__':",
]
